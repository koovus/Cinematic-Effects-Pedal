kind = "web"
previewPath = "/"
title = "CEP1 — Movie-Themed Audio Pedal"
version = "1.0.0"
id = "artifacts/cep1"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23723

[services.development]
run = "pnpm --filter @workspace/cep1 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cep1", "run", "build" ]
publicDir = "artifacts/cep1/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23723"
BASE_PATH = "/"
